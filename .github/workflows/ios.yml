name: ios-capture build

# ios-capture(App Store 제품화, PRODUCT-PLAN.md)의 첫 CI 단계 -- 사람이 매번
# 로컬에서 빌드해보지 않아도 배포 타깃(17.0)/Info.plist 병합 같은 변경이 실제로
# 컴파일되는지 자동으로 확인한다. macOS 러너에서만 도는 유일한 워크플로다(나머지
# 저장소는 Node/Go/Python이라 리눅스 러너로 충분).
#
# vps.xcodeproj에는 원래 커밋된 스킴이 없었다(Xcode가 사용자별로 자동 생성) --
# CI가 -scheme으로 고를 대상이 없어서 vps.xcodeproj/xcshareddata/xcschemes/vps.xcscheme
# 를 직접 만들어 커밋했다.

on:
  push:
    paths:
      - "ios-capture/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-capture/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-capture
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (iOS Simulator, no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project vps.xcodeproj \
            -scheme vps \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      # 2026-09-04: 테스트 타깃이 생겼다(Xcode에서 사람이 직접 추가, 이름은
      # vpsTests와의 폴더명 충돌 때문에 ScanMeshTests가 됨 -- 기능상 무관).
      # `vps` 스킴의 TestAction에 이미 배선돼 있어 `-scheme vps`만으로 돈다.
      # 로컬 시뮬레이터에서 10개 전부 통과 확인 후 필수 게이트로 승격.
      #
      # 처음엔 destination을 "name=iPhone 16"으로 고정했다가 바로 다음 실행에서
      # "Unable to find a device matching..."로 깨졌다 -- GitHub 러너 이미지가
      # 미리 만들어두는 시뮬레이터 라인업이 Xcode/러너 버전마다 바뀌는데(이번엔
      # "iPhone 16"이 없고 iPhone 17/17 Pro/17e/Air만 있었음), 특정 모델명을
      # 박아두면 또 같은 이유로 깨진다. 그래서 이름을 아예 안 박고, 그 시점에
      # 실제로 있는 iPhone 시뮬레이터 하나를 매번 동적으로 골라 쓴다.
      # 첫 시도(단순 head -n1)는 iOS 26.4.1짜리 iPhone을 골랐다가 "Cannot test
      # target ... doesn't match ... iOS Simulator 26.5 deployment target"으로
      # 또 깨졌다 -- 타깃의 배포 타깃(그때는 실수로 26.5)보다 낮은 런타임을 뽑은
      # 것. 이제 타깃 배포 타깃은 앱과 맞춰 17.0으로 내렸지만, 그거와 별개로
      # "구버전 런타임을 뽑을 위험" 자체를 없애기 위해 OS 버전 내림차순 정렬 후
      # 제일 최신 걸 고른다(Any/최신 iOS를 요구하는 타깃이 나중에 생겨도 안전).
      #
      # 그 다음 실행은 테스트 자체는 10개 전부 통과했는데도 exit 65로 깨졌다 --
      # 스킴의 TestableReference가 parallelizable="YES"라 xcodebuild가 시뮬레이터
      # 클론을 2개(Clone 1/Clone 2 of iPhone 17) 띄워 병렬로 도는데, 그 중 하나가
      # "Simulator device failed to launch ... RequestDenied / test runner hung
      # before establishing connection"으로 죽었다 -- 코드 문제가 아니라 CI 러너
      # 리소스 제약에서 오는 병렬 시뮬레이터 부팅 경합. 테스트가 10개뿐이라 병렬화
      # 이득도 없어서, 스킴 쪽 parallelizable을 NO로 내리고 여기서도
      # -disable-concurrent-testing으로 이중으로 막아 단일 시뮬레이터에서만 돈다.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # 러너의 시뮬레이터 목록에서 실제로 있는 iOS 버전 중 가장 최신 하나를
          # 골라 그 안의 iPhone 하나를 쓴다. 런타임 키는
          # "com.apple.CoreSimulator.SimRuntime.iOS-26-5"처럼 점이 아니라
          # 하이픈으로 버전을 구분해서 오는데, jq에서 숫자로 미리 변환해두면
          # sort -n이 그대로 먹는다.
          udid=$(xcrun simctl list devices available -j \
            | jq -r '
              .devices | to_entries[]
              | select(.key | test("^com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS-"))
              | (.key | sub("^com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS-";"") | split("-") | map(tonumber)) as $v
              | .value[]
              | select(.name | test("iPhone"))
              | "\($v[0])\t\($v[1])\t\(if ($v[2] // null) then $v[2] else 0 end)\t\(.udid)"
            ' \
            | sort -t $'\t' -k1,1n -k2,2n -k3,3n \
            | tail -n1 \
            | cut -f4)
          if [ -z "$udid" ]; then
            echo "no available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test (ScanMeshTests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project vps.xcodeproj \
            -scheme vps \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -disable-concurrent-testing \
            CODE_SIGNING_ALLOWED=NO
