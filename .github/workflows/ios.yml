name: ios-capture build

# ios-capture(App Store 제품화, PRODUCT-PLAN.md)의 첫 CI 단계 -- 사람이 매번
# 로컬에서 빌드해보지 않아도 배포 타깃(17.0)/Info.plist 병합 같은 변경이 실제로
# 컴파일되는지 자동으로 확인한다. macOS 러너에서만 도는 유일한 워크플로다(나머지
# 저장소는 Node/Go/Python이라 리눅스 러너로 충분).
#
# vps.xcodeproj에는 원래 커밋된 스킴이 없었다(Xcode가 사용자별로 자동 생성) --
# CI가 -scheme으로 고를 대상이 없어서 vps.xcodeproj/xcshareddata/xcschemes/vps.xcscheme
# 를 직접 만들어 커밋했다.

on:
  push:
    paths:
      - "ios-capture/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-capture/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-capture
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (iOS Simulator, no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project vps.xcodeproj \
            -scheme vps \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      # 2026-09-04: 테스트 타깃이 생겼다(Xcode에서 사람이 직접 추가, 이름은
      # vpsTests와의 폴더명 충돌 때문에 ScanMeshTests가 됨 -- 기능상 무관).
      # `vps` 스킴의 TestAction에 이미 배선돼 있어 `-scheme vps`만으로 돈다.
      # 로컬 시뮬레이터에서 10개 전부 통과 확인 후 필수 게이트로 승격.
      - name: Test (ScanMeshTests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project vps.xcodeproj \
            -scheme vps \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
